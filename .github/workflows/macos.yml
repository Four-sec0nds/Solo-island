name: macOS installer
on:
  push:
    branches: [solo-island, 'preview/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-island-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test, bundle media helper and create DMG
        id: build
        shell: bash
        run: |
          set -o pipefail
          {
            command -v cmake || brew install cmake
            node --test Tests/WebPlayerTests/bridge.test.cjs
            python3 -m unittest discover -s Tests/PackagingTests -v
            bash scripts/build.sh
          } 2>&1 | tee "$RUNNER_TEMP/solo-build.log"
      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoloIsland-DMG
          path: |
            dist/SoloIsland.dmg
            dist/SoloIsland.dmg.sha256
            dist/SoloIsland-preview.png
            dist/SoloIsland-tasks.png
            dist/SoloIsland-actions.png
            dist/SoloIsland-focus.png
            dist/SoloIsland-files.png
            dist/SoloIsland-onboarding.png
            dist/SoloIsland-custom-focus.png
            dist/SoloIsland-deadline.png
            dist/SoloIsland-reminder.png
            dist/SoloIsland-settings.png
            dist/SoloIsland-web-demo.png
            dist/SoloIsland-icon.png
            dist/SoloIsland-music-compact.png
            dist/SoloIsland-tasks-compact.png
            dist/SoloIsland-focus-compact.png
            dist/SoloIsland-settings-compact.png
            dist/SoloIsland-settings-appearance.png
            dist/SoloIsland-music-empty.png
            dist/SoloIsland-tasks-empty.png
            dist/SoloIsland-music-error.png
            dist/SoloIsland-notch-music.png
            dist/SoloIsland-notch-paused.png
            dist/SoloIsland-notch-focus.png
            dist/SoloIsland-notch-focus-paused.png
            dist/SoloIsland-notch-combined.png
          if-no-files-found: error
      - name: Save installer and build result in the repository
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/solo-island'
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: bash scripts/publish-build.sh
      - name: Save test installer only in its preview branch
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/preview/')
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: bash scripts/publish-preview.sh
